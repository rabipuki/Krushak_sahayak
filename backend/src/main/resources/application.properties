# Spring Application Configuration
spring.application.name=krushak-sahayak-backend
server.port=8080

# Primary MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/smart_farming_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Python AI Microservice URL
ai.service.url=http://127.0.0.1:8000

# JWT Security Configuration
app.jwt.secret=9a3412f59e0b16653415803d45c820f781a943e8d26c518b76251b3f9e61280d
app.jwt.expiration-ms=86400000

# Weather API Configuration (Default Open-Meteo & OpenWeather integration)
weather.api.key=
weather.api.default-district=Cuttack
