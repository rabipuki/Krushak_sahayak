    // =========================================================================
    // 3. TEXT TO SPEECH (Web Speech API)
    // =========================================================================
    function speakText(key, text, lang = "or", activeKey, setActiveKey) {
      if (!('speechSynthesis' in window)) return;
      if (activeKey === key) {
        window.speechSynthesis.cancel();
        setActiveKey(null);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === "or" ? "or-IN" : "en-IN";
      utterance.rate = 0.9;
      utterance.onend = () => setActiveKey(null);
      utterance.onerror = () => setActiveKey(null);
      setActiveKey(key);
      window.speechSynthesis.speak(utterance);
    }

      // Voice recognition state
      const [isRecording, setIsRecording] = useState(false);
      const [voiceTranscript, setVoiceTranscript] = useState('');
      const [voiceEditing, setVoiceEditing] = useState(false);
      const [voiceFeedbackMsg, setVoiceFeedbackMsg] = useState('');

      // Current District Weather
      const [selectedDistrict, setSelectedDistrict] = useState('cuttack');
      const [weatherData, setWeatherData] = useState(null);

      // Dashboard stats
      const [dashboardStats, setDashboardStats] = useState({
        totalPlants: 1,
        totalSoils: 1,
        recentHistory: []
      });

      // Load initial weather & dashboard from backend
      useEffect(() => {
        fetchDashboardData();
        fetchWeatherData(selectedDistrict);
      }, [selectedDistrict]);

      const fetchDashboardData = async () => {
        try {
          const res = await fetch('/api/farmer/dashboard');
          if (res.ok) {
            const data = await res.json();
            setDashboardStats({
              totalPlants: data.totalPlantAnalyses || 1,
              totalSoils: data.totalSoilAnalyses || 1,
              recentHistory: data.recentHistory || []
            });
          }
        } catch (e) {
          console.log('Using local dashboard state');
        }
      };

      const fetchWeatherData = async (dist) => {
        try {
          const res = await fetch(`/api/weather/current?district=${dist}`);
          if (res.ok) {
            const data = await res.json();
            setWeatherData(data);
          }
        } catch (e) {
          console.log('Using fallback weather');
        }
      };

      // Native Odia Speech Recognition Setup
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          const rec = new SpeechRec();
          rec.continuous = false;
          rec.interimResults = true;
          rec.lang = lang === 'or' ? 'or-IN' : 'en-US';

          rec.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              transcript += event.results[i][0].transcript;
            }
            setVoiceTranscript(transcript);
          };

          rec.onend = () => {
            setIsRecording(false);
            if (voiceTranscript) {
              processVoiceCommand(voiceTranscript);
            }
          };

          rec.onerror = (e) => {
            console.error('Speech recognition error', e);
            setIsRecording(false);
          };

          recognitionRef.current = rec;
        }
      }, [lang, voiceTranscript]);

      const startVoiceRecording = () => {
        setVoiceTranscript('');
        setVoiceFeedbackMsg('');
        if (recognitionRef.current) {
          try {
            recognitionRef.current.lang = lang === 'or' ? 'or-IN' : 'en-US';
            recognitionRef.current.start();
            setIsRecording(true);
          } catch (e) {
            console.log('Restarting speech recognition');
          }
        } else {
          // Simulation fallback for browsers without Web Speech
          setIsRecording(true);
          setTimeout(() => {
            const sample = lang === 'or' 
              ? "ମୋ ବୟସ ୫୫ ବର୍ଷ, ମୁଁ ଜଣେ ଚାଷୀ, ବାର୍ଷିକ ଆୟ ୪୦,୦୦୦ ଟଙ୍କା ଏବଂ ମୋର ରାସନ କାର୍ଡ ଅଛି।"
              : "I am a farmer, age 55, income 40000, and I have a ration card.";
            setVoiceTranscript(sample);
            setIsRecording(false);
            processVoiceCommand(sample);
          }, 2000);
        }
      };

      const stopVoiceRecording = () => {
        if (recognitionRef.current) {
          recognitionRef.current.stop();
        }
        setIsRecording(false);
      };

      // Intelligent Voice Command & Auto-fill processing
      const processVoiceCommand = (text) => {
        const lower = text.toLowerCase();
        
        // 1. Navigation voice commands
        if (lower.includes('ମାଟି') || lower.includes('soil') || lower.includes('mitti')) {
          handleNavClick('soil');

          return;
        }
        if (lower.includes('ଗଛ') || lower.includes('plant') || lower.includes('rog') || lower.includes('ରୋଗ')) {
          handleNavClick('plant');
          setVoiceFeedbackMsg('ଗଛ ରୋଗ ନିରୂପଣ ପୃଷ୍ଠା ଖୋଲାଗଲା (Navigated to Plant Analysis)');
          return;
        }
        if (lower.includes('ପାଣିପାଗ') || lower.includes('weather') || lower.includes('mausam')) {
          handleNavClick('weather');
          setVoiceFeedbackMsg('ପାଣିପାଗ ସହାୟକ ପୃଷ୍ଠା ଖୋଲାଗଲା (Navigated to Weather Assistant)');
          return;
        }
        if (lower.includes('କ୍ୟାଲେଣ୍ଡର') || lower.includes('calendar')) {
          handleNavClick('calendar');
          setVoiceFeedbackMsg('କୃଷି କ୍ୟାଲେଣ୍ଡର ପୃଷ୍ଠା ଖୋଲାଗଲା (Navigated to Crop Calendar)');
          return;
        }

        // 2. Form auto-fill extraction
        let extractedAge = 55;
        let extractedIncome = 40000;
        const numMatches = text.match(/\d+/g);
        if (numMatches && numMatches.length > 0) {
          numMatches.forEach(numStr => {
            const n = parseInt(numStr, 10);
            if (n >= 18 && n <= 100) extractedAge = n;
            if (n > 1000) extractedIncome = n;
          });
        }

        const updated = {
          age: extractedAge,
          occupation: 'Farmer',
          income: extractedIncome,
          has_ration_card: text.includes('ରାସନ') || text.includes('card') || text.includes('राशन')
        };
        setFormData(updated);
        setHighlightVoiceUpdate(true);
        setTimeout(() => setHighlightVoiceUpdate(false), 4000);
        setVoiceFeedbackMsg('ଓଡ଼ିଆ ଭଏସ୍ ରୁ ଫର୍ମ ସଫଳତାର ସହ ପୂରଣ ହେଲା (Form auto-filled from speech)');
      };

      // Protected Route Navigation Handler
      const handleNavClick = (pageKey) => {
        // Requirement: Soil Information (Sidebar option 4) accessible ONLY after successful login
        if (pageKey === 'soil' && (!currentUser || !currentUser.isLoggedIn)) {

      const handleLoginSuccess = (userObj) => {

      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'visual_soil', 'lab_report'
      
      // Visual soil state
      const [soilImage, setSoilImage] = useState(null);
      const [soilImagePreview, setSoilImagePreview] = useState(null);
      const [isAnalyzingSoil, setIsAnalyzingSoil] = useState(false);
      const [soilAnalysisResult, setSoilAnalysisResult] = useState(null);

      // Lab test report state
      const [labForm, setLabForm] = useState({
        ph: 6.4,
        nitrogen: 240,
        phosphorus: 12,
        potassium: 145,
        organic_carbon: 0.48,
        electrical_conductivity: 0.35,
        target_crop: 'Paddy / Rice (ଧାନ)'
      });
      const [labEvaluationResult, setLabEvaluationResult] = useState(null);
      const [isSubmittingLab, setIsSubmittingLab] = useState(false);

      const handleSoilImageChange = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setSoilImage(file);
          const reader = new FileReader();
          reader.onloadend = () => setSoilImagePreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleRunVisualSoilAnalysis = async () => {
        setIsAnalyzingSoil(true);
        try {
          const res = await fetch('/api/soil/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ph: labForm.ph,
              nitrogen: labForm.nitrogen,
              phosphorus: labForm.phosphorus,
              potassium: labForm.potassium,
              imageUrl: soilImagePreview || 'https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=400&q=80'
            })
          });
          const data = await res.json();
          setSoilAnalysisResult(data.visual_analysis);
          if (data.lab_test_evaluation) {
            setLabEvaluationResult(data.lab_test_evaluation);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setIsAnalyzingSoil(false);
        }
      };

      const handleEvaluateLabReport = async (e) => {
        if (e) e.preventDefault();
        setIsSubmittingLab(true);
        try {
          const res = await fetch('/api/soil/test-report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(labForm)
          });
          const data = await res.json();
          setLabEvaluationResult(data);
        } catch (e) {
          console.error(e);
        } finally {
          setIsSubmittingLab(false);
        }
      };

                      <input
                        type="number"
                        step="5"
                        value={labForm.nitrogen}
                        onChange={(e) => setLabForm({ ...labForm, nitrogen: Number(e.target.value) })}

                      />
                      <span className="text-[10px] text-stone-500">କମ୍: &lt; 280, ମଧ୍ୟମ: 280-560</span>
                    </div>

                    {/* Phosphorus */}
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">
                        ଫସଫରସ୍ P (kg/ha)
                      </label>
                      <input
                        type="number"
                        step="1"
                        value={labForm.phosphorus}
                        onChange={(e) => setLabForm({ ...labForm, phosphorus: Number(e.target.value) })}
                        className="w-full p-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-amber-500 font-bold"
                      />
                      <span className="text-[10px] text-stone-500">କମ୍: &lt; 10, ମଧ୍ୟମ: 10-25</span>
                    </div>

                    {/* Potassium */}
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">
                        ପଟାସିୟମ୍ K (kg/ha)
                      </label>
                      <input
                        type="number"
                        step="5"
                        value={labForm.potassium}
                        onChange={(e) => setLabForm({ ...labForm, potassium: Number(e.target.value) })}
                        className="w-full p-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-amber-500 font-bold"
                      />
                      <span className="text-[10px] text-stone-500">କମ୍: &lt; 110, ମଧ୍ୟମ: 110-280</span>
                    </div>

                    {/* Organic Carbon */}
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">
                        ଜୈବିକ ଅଙ୍ଗାର OC (%)
                      </label>
                      <input
                        type="number"
                        step="0.05"
                        value={labForm.organic_carbon}
                        onChange={(e) => setLabForm({ ...labForm, organic_carbon: Number(e.target.value) })}
                        className="w-full p-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-amber-500 font-bold"
                      />
                      <span className="text-[10px] text-stone-500">ଉତ୍ତମ: &gt; 0.75%</span>
                    </div>

                    {/* EC */}
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">
                        ବିଦ୍ୟୁତ୍ ପରିବାହିତା EC (dS/m)
                      </label>
                      <input
                        type="number"
                        step="0.05"
                        value={labForm.electrical_conductivity}
                        onChange={(e) => setLabForm({ ...labForm, electrical_conductivity: Number(e.target.value) })}
                        className="w-full p-3 rounded-xl border border-stone-300 focus:ring-2 focus:ring-amber-500 font-bold"
                      />
                      <span className="text-[10px] text-stone-500">ନିରାପଦ: &lt; 1.0</span>
                    </div>
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={isSubmittingLab}
                      className="w-full sm:w-auto px-8 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-green-950 font-black text-sm shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"
                    >
                      {isSubmittingLab ? 'ବିଶ୍ଳେଷଣ ଚାଲିଛି...' : '🔬 ରିପୋର୍ଟ ବିଶ୍ଳେଷଣ କରନ୍ତୁ ଓ ସାର ସୂଚୀ ପାଆନ୍ତୁ'}
                    </button>
                  </div>
                </form>
              </div>

              {/* Lab Evaluation Results & Fertilizer Schedule */}
              {labEvaluationResult && (
                <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-md border-2 border-green-800 animate-fadeIn space-y-6">
                  <div className="flex items-center justify-between border-b pb-4">
                    <div>
                      <span className="text-xs bg-emerald-100 text-emerald-900 border border-emerald-300 px-3 py-1 rounded-full font-bold">
                        ବୈଜ୍ଞାନିକ ମୃଦା ପରୀକ୍ଷା ଫଳାଫଳ (ICAR Verified)
                      </span>
                      <h4 className="text-xl sm:text-2xl font-black text-green-950 mt-2">
                        ମାଟି ପ୍ରକୃତି: {labEvaluationResult.ph_classification_or || labEvaluationResult.ph_classification}
                      </h4>
                      <p className="text-xs text-stone-500">
                        Soil pH: {labEvaluationResult.ph_value || labForm.ph}
                      </p>
                    </div>

                    <button
                      onClick={() => speakText('lab_eval', `ମାଟି ପ୍ରକୃତି: ${labEvaluationResult.ph_classification_or || labEvaluationResult.ph_classification}। ସୁପାରିଶ କରାଯାଇଥିବା ସାର: ${labEvaluationResult.fertilizerSchedule || labEvaluationResult.recommended_fertilizer_schedule?.join('। ')}`, 'or', speakingKey, setSpeakingKey)}
                      className={`text-xs px-3.5 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow ${
                        speakingKey === 'lab_eval' ? 'bg-red-600 text-white animate-pulse' : 'bg-green-800 text-amber-300'
                      }`}
                    >
                      <span>{speakingKey === 'lab_eval' ? '⏹️' : '🔊'}</span>
                      <span>ଶୁଣନ୍ତୁ</span>
                    </button>
                  </div>

                  {/* Fertilizer Schedule */}
                  <div className="space-y-3">
                    <h5 className="text-sm font-black text-green-950 uppercase tracking-wider flex items-center gap-2">
                      <span>🌾</span>
                      <span>ସୁପାରିଶ କୃତ ସାର ପ୍ରୟୋଗ ସୂଚୀ (Fertilizer Schedule):</span>
                    </h5>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      {(labEvaluationResult.recommended_fertilizer_schedule || labEvaluationResult.fertilizerSchedule || []).map((step, idx) => (
                        <div key={idx} className="bg-orange-50/70 p-4 rounded-2xl border border-orange-200 text-xs text-stone-800 font-semibold leading-relaxed">
                          <span className="w-5 h-5 rounded-full bg-amber-500 text-green-950 font-black inline-flex items-center justify-center mr-1.5">
                            {idx + 1}
                          </span>
                          {step}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Soil Amendments (Lime / Gypsum if acidic or alkaline) */}
                  {labEvaluationResult.soil_amendments && labEvaluationResult.soil_amendments.length > 0 && (
                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs">
                      <strong className="block font-bold text-amber-950 mb-1">
                        ମାଟି ସଂଶୋଧନ ପରାମର୍ଶ (Soil Amendments):
                      </strong>
                      <p className="text-stone-700">{labEvaluationResult.soil_amendments[0]}</p>
                    </div>
                  )}

                  {/* Organic Alternatives */}
                  <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs">
                    <strong className="block font-bold text-emerald-950 mb-1">
                      ଜୈବିକ ବିକଳ୍ପ (Organic Alternatives):
                    </strong>
                    <p className="text-stone-700">
                      {labEvaluationResult.organicAlternativesOr ? labEvaluationResult.organicAlternativesOr[0] : 'ଏକର ପ୍ରତି ୨.୫ ଟନ୍ ଗୋବର ଖତ ଏବଂ ଜୀବାମୃତ ପ୍ରୟୋଗ କରନ୍ତୁ।'}
                    </p>
                  </div>

                  <div className="text-[11px] text-stone-400 text-right">
                    Official Reference: Integrated Nutrient Management (INM) Guidelines, ICAR & Directorate of Agriculture, Odisha
                  </div>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 7. VIEW: PLANT DISEASE DETECTION & AI DIAGNOSIS (Section 6 Requirement)
    // =========================================================================
    function PlantDiseasePageView({ currentUser, onNavigate, onAnalysisSaved }) {
      const [plantImage, setPlantImage] = useState(null);
      const [plantPreview, setPlantPreview] = useState(null);
      const [cropHint, setCropHint] = useState('Paddy / Rice');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [diagnosisResult, setDiagnosisResult] = useState(null);
      const [speakingDiag, setSpeakingDiag] = useState(null);

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setPlantImage(file);
          const reader = new FileReader();
          reader.onloadend = () => setPlantPreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAnalyzePlant = async () => {
        setIsAnalyzing(true);
        try {
          const res = await fetch('/api/plant/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              crop_hint: cropHint,
              imageUrl: plantPreview || 'https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?auto=format&fit=crop&w=400&q=80'
            })
          });
          const data = await res.json();
          setDiagnosisResult(data);
          if (onAnalysisSaved) onAnalysisSaved();
        } catch (e) {
          console.error(e);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const downloadPDFReport = () => {
        if (!window.jspdf || !diagnosisResult) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFillColor(22, 101, 52);
        doc.rect(0, 0, 210, 24, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text("KRUSHAK SAHAYAK - PLANT HEALTH REPORT", 14, 16);

        doc.setTextColor(30, 30, 30);
        doc.setFontSize(11);
        doc.text(`Farmer Name: ${currentUser.fullName || 'Ramesh Chandra Sahoo'}`, 14, 35);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 42);
        doc.text(`District: ${currentUser.district || 'Cuttack'}, Odisha`, 14, 49);

        doc.setDrawColor(200, 200, 200);
        doc.line(14, 53, 196, 53);

        doc.setFontSize(14);
        doc.setTextColor(22, 101, 52);
        doc.text(`Diagnosed Disease: ${diagnosisResult.disease_name}`, 14, 63);

        doc.setFontSize(10);
        doc.setTextColor(60, 60, 60);
        doc.text(`Crop: ${diagnosisResult.detected_plant}`, 14, 71);
        doc.text(`Confidence Score: ${diagnosisResult.confidence_percentage} (${diagnosisResult.mode_label})`, 14, 78);
        doc.text(`Severity: ${diagnosisResult.severity}`, 14, 85);

        doc.setFontSize(12);
        doc.setTextColor(22, 101, 52);
        doc.text("Recommended Treatment:", 14, 98);
        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40);
        doc.text(doc.splitTextToSize(diagnosisResult.recommended_treatment, 180), 14, 106);

        doc.setFontSize(12);
        doc.setTextColor(22, 101, 52);
        doc.text("Organic Alternatives:", 14, 126);
        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40);
        doc.text(doc.splitTextToSize(diagnosisResult.organic_treatment, 180), 14, 134);

        doc.setFontSize(12);
        doc.setTextColor(22, 101, 52);
        doc.text("Fertilizer & Nutrition Advisory:", 14, 154);
        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40);
        doc.text(doc.splitTextToSize(diagnosisResult.suitable_fertilizers, 180), 14, 162);

        doc.setFillColor(245, 158, 11);
        doc.rect(14, 180, 182, 20, 'F');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(9);
        doc.text("Safety Note: Strictly follow ICAR / OUAT verified dosage guidelines.", 18, 192);

        doc.save(`Plant_Health_Report_${diagnosisResult.detected_plant?.replace(/\W/g, '_')}.pdf`);
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* Header */}
          <div className="bg-gradient-to-r from-green-900 via-green-800 to-green-900 text-white rounded-3xl p-6 sm:p-8 shadow-md border-b-4 border-amber-500">
            <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-400 text-green-950 mb-2">
              🌿 AI କୃଷି ଡାଇଗ୍ନୋଷ୍ଟିକ୍ସ • AI Crop Diagnostics
            </span>
            <h2 className="text-2xl sm:text-4xl font-black text-white">
              AI ଗଛ ରୋଗ ନିରୂପଣ ଓ ଉପଚାର (Plant Disease Detection)
            </h2>
            <p className="text-xs sm:text-sm text-amber-200 mt-1 max-w-xl">
              ରୋଗାକ୍ରାନ୍ତ ପତ୍ରର ଫଟୋ ଅପଲୋଡ୍ କରି ତୁରନ୍ତ ସଠିକ୍ ରୋଗ ଚିହ୍ନଟ, ସୁପାରିଶ କୃତ ଚିକିତ୍ସା ଓ ଜୈବିକ ଉପଚାର ପାଆନ୍ତୁ।
            </p>
          </div>

          {/* Upload / Camera Card */}
          <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-md border-2 border-green-800/15">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              
              {/* Image Preview & Selector */}
              <div className="border-2 border-dashed border-stone-300 rounded-3xl p-6 text-center hover:border-amber-500 transition-colors flex flex-col items-center justify-center min-h-[220px]">
                {plantPreview ? (
                  <div className="relative">
                    <img 
                      src={plantPreview} 
                      alt="Crop Leaf Preview" 
                      className="w-52 h-52 object-cover rounded-2xl shadow border-2 border-green-700"
                    />
                    <button
                      onClick={() => { setPlantImage(null); setPlantPreview(null); }}
                      className="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs shadow"
                    >
                      ✕
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="w-16 h-16 rounded-full bg-green-100 text-green-800 flex items-center justify-center text-3xl mb-3">
                      🍃
                    </div>
                    <p className="text-sm font-bold text-stone-800 mb-1">
                      ରୋଗାକ୍ରାନ୍ତ ପତ୍ରର ସ୍ପଷ୍ଟ ଫଟୋ ଉଠାନ୍ତୁ କିମ୍ବା ବାଛନ୍ତୁ
                    </p>
                    <p className="text-xs text-stone-500 mb-4">
                      JPG, JPEG, PNG (ଆଲୋକରେ ଉଠାନ୍ତୁ)
                    </p>
                    <div className="flex flex-wrap items-center justify-center gap-2">
                      <label className="cursor-pointer bg-green-800 hover:bg-green-900 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow active:scale-95 transition-all">
                        <span>📷 କ୍ୟାମେରା / ଗ୍ୟାଲେରୀ</span>
                        <input 
                          type="file" 
                          accept="image/*" 
                          capture="environment"
                          onChange={handleImageUpload} 
                          className="hidden" 
                        />
                      </label>
                    </div>
                  </>
                )}
              </div>

              {/* Crop Selector & Run Analysis */}
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">
                    ଫସଲ ଚୟନ କରନ୍ତୁ (Select Crop):
                  </label>
                  <select
                    value={cropHint}
                    onChange={(e) => setCropHint(e.target.value)}
                    className="w-full p-3 rounded-xl border border-stone-300 font-bold text-stone-800 focus:ring-2 focus:ring-amber-500"
                  >
                    <option value="Paddy / Rice">ଧାନ (Paddy / Rice)</option>
                    <option value="Tomato">ବିଲାତି ବାଇଗଣ (Tomato)</option>
                    <option value="Potato">ଆଳୁ (Potato)</option>
                    <option value="Maize">ମକା (Maize / Corn)</option>
                    <option value="Groundnut">ଚିନାବାଦାମ (Groundnut)</option>
                  </select>
                </div>

                <div className="bg-orange-50 p-3.5 rounded-2xl border border-orange-100 text-xs text-stone-700 leading-relaxed">
                  ✓ AI ସୁରକ୍ଷା ନିୟମ: ଅନିଶ୍ଚିତ ଫଟୋ ଉପରେ କୌଣସି ରାସାୟନିକ ଔଷଧ ସୁପାରିଶ କରାଯାଏ ନାହିଁ। କେବଳ ICAR/OUAT ପ୍ରମାଣିତ ଡୋଜ୍ ପ୍ରଦର୍ଶିତ ହୁଏ।
                </div>

                <button
                  type="button"
                  onClick={handleAnalyzePlant}
                  disabled={isAnalyzing}
                  className={`w-full py-3.5 rounded-2xl font-black text-sm shadow-lg transition-all flex items-center justify-center gap-2 ${
                    isAnalyzing 
                      ? 'bg-stone-300 text-stone-500 cursor-wait'
                      : 'bg-green-800 hover:bg-green-900 text-white active:scale-95'
                  }`}
                >
                  {isAnalyzing ? (
                    <>
                      <span className="animate-spin text-lg">⏳</span>
                      <span>AI ମଡେଲ୍ ପତ୍ର ବିଶ୍ଳେଷଣ କରୁଛି...</span>
                    </>
                  ) : (
                    <>
                      <span>🔍</span>
                      <span>ରୋଗ ପରୀକ୍ଷା କରନ୍ତୁ (Analyze Plant Disease)</span>
                    </>
                  )}
                </button>
              </div>

            </div>
          </div>

          {/* Analysis Results Display */}
          {diagnosisResult && (
            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-md border-2 border-green-800 animate-fadeIn space-y-6">
              
              {/* Top Result Banner */}
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b pb-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-300">
                      {diagnosisResult.mode_label || 'Verified Knowledge Engine'}
                    </span>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-black bg-red-100 text-red-800">
                      ତୀବ୍ରତା: {diagnosisResult.severity}
                    </span>
                  </div>
                  <h3 className="text-2xl sm:text-3xl font-black text-green-950 mt-2">
                    {diagnosisResult.disease_name_or}
                  </h3>
                  <p className="text-xs text-stone-500 font-bold">
                    {diagnosisResult.disease_name} • {diagnosisResult.detected_plant}
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => speakText('diag', `${diagnosisResult.detected_plant_or} ଫସଲରେ ${diagnosisResult.disease_name_or} ଚିହ୍ନଟ ହୋଇଛି। ଚିକିତ୍ସା: ${diagnosisResult.treatment_or}। ଜୈବିକ ଉପଚାର: ${diagnosisResult.organic_treatment_or}`, 'or', speakingDiag, setSpeakingDiag)}
                    className="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-500 text-green-950 font-bold text-xs shadow flex items-center gap-1"
                  >
                    <span>{speakingDiag === 'diag' ? '⏹️' : '🔊'}</span>
                    <span>ଶୁଣନ୍ତୁ (Odia)</span>
                  </button>
                  <button
                    onClick={downloadPDFReport}
                    className="px-4 py-2 rounded-xl bg-green-800 hover:bg-green-900 text-white font-bold text-xs shadow flex items-center gap-1.5"
                  >
                    <span>📥</span>
                    <span>PDF ଡାଉନଲୋଡ୍</span>
                  </button>
                </div>
              </div>

              {/* Confidence & Health Status */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                  <span className="text-stone-500 font-bold block">ବିଶ୍ୱସନୀୟତା (Confidence):</span>
                  <span className="text-lg font-black text-emerald-700">{diagnosisResult.confidence_percentage}</span>
                </div>
                <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                  <span className="text-stone-500 font-bold block">ସ୍ୱାସ୍ଥ୍ୟ ସ୍ଥିତି:</span>
                  <span className="text-lg font-black text-red-600">{diagnosisResult.health_status}</span>
                </div>
                <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                  <span className="text-stone-500 font-bold block">ଜଳ ଆବଶ୍ୟକତା:</span>
                  <span className="text-xs font-black text-stone-800">{diagnosisResult.water_requirements}</span>
                </div>
                <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                  <span className="text-stone-500 font-bold block">ସୂର୍ଯ୍ୟାଲୋକ:</span>
                  <span className="text-xs font-black text-stone-800">{diagnosisResult.sunlight_requirements}</span>
                </div>
              </div>

              {/* Symptoms & Causes */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
                <div className="bg-orange-50/70 p-4 rounded-2xl border border-orange-100">
                  <h5 className="font-black text-green-950 mb-1 flex items-center gap-1.5">
                    <span>🔍</span>
                    <span>ଦୃଶ୍ୟମାନ ଲକ୍ଷଣ (Visible Symptoms):</span>
                  </h5>
                  <p className="text-stone-800 leading-relaxed font-medium">
                    {diagnosisResult.symptoms_or || diagnosisResult.visible_symptoms?.[0]}
                  </p>
                </div>

    // =========================================================================
    // 14. AUTH MODAL (Login / Register / Forgot Password)
    // =========================================================================
    function AuthModalView({ authTab, setAuthTab, onClose, onLoginSuccess }) {
      const [phone, setPhone] = useState('9876543210');
      const [password, setPassword] = useState('password123');
      const [fullName, setFullName] = useState('');
      const [district, setDistrict] = useState('Cuttack');
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          if (authTab === 'login') {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identifier: phone, password })
            });
            const data = await res.json();
            if (res.ok) {
              onLoginSuccess(data);
            } else {
              setErrorMsg(data.error || 'ଲଗଇନ୍ ବିଫଳ ହେଲା');
            }
          } else if (authTab === 'register') {
            const res = await fetch('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fullName, phone, password, district })
            });
            const data = await res.json();
            if (res.ok) {
              onLoginSuccess(data);
            } else {
              setErrorMsg(data.error || 'ପଞ୍ଜୀକରଣ ବିଫଳ ହେଲା');
            }
          } else {
            alert("ପାସୱାର୍ଡ ରିସେଟ୍ OTP: 4521 ଆପଣଙ୍କ ମୋବାଇଲ୍ କୁ ପଠାଗଲା।");
            setAuthTab('login');
          }
        } catch (err) {
          setErrorMsg('ସର୍ଭର ସଂଯୋଗ ବିଫଳ ହେଲା');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-amber-500 relative">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 text-stone-400 hover:text-stone-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg"
            >
              ✕
            </button>

            {/* Header */}
            <div className="text-center mb-6">
              <span className="text-3xl">🌾</span>
              <h3 className="text-xl font-black text-green-950 mt-1">
                {authTab === 'login' ? 'କୃଷକ ଲଗଇନ୍ (Farmer Login)' : (authTab === 'register' ? 'ନୂତନ ପଞ୍ଜୀକରଣ (Registration)' : 'ପାସୱାର୍ଡ ପୁନରୁଦ୍ଧାର')}
              </h3>
              <p className="text-xs text-stone-500 mt-1">
                "ମାଟି ବିଷୟରେ ସୂଚନା" ଏବଂ ଡ୍ୟାସବୋର୍ଡ ଦେଖିବା ପାଇଁ ଲଗଇନ୍ କରନ୍ତୁ।
              </p>
            </div>

            {/* Tabs */}
            <div className="flex border-b border-stone-200 mb-4 text-xs font-bold text-center">
              <button
                onClick={() => { setAuthTab('login'); setErrorMsg(''); }}
                className={`flex-1 py-2 border-b-2 ${authTab === 'login' ? 'border-amber-500 text-green-950' : 'border-transparent text-stone-400'}`}
              >
                ଲଗଇନ୍ (Login)
              </button>
              <button
                onClick={() => { setAuthTab('register'); setErrorMsg(''); }}
                className={`flex-1 py-2 border-b-2 ${authTab === 'register' ? 'border-amber-500 text-green-950' : 'border-transparent text-stone-400'}`}
              >
                ପଞ୍ଜୀକରଣ (Register)
              </button>
            </div>

            {errorMsg && (
              <div className="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-xs font-bold border border-red-200">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              {authTab === 'register' && (
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">କୃଷକଙ୍କ ପୂରା ନାମ:</label>
                  <input
                    type="text"
                    required
                    placeholder="ଯଥା: ରମେଶ ଚନ୍ଦ୍ର ସାହୁ"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    className="w-full p-2.5 rounded-xl border font-bold text-sm"
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">ମୋବାଇଲ୍ ନମ୍ବର / Phone:</label>
                <input
                  type="tel"
                  required
                  placeholder="10 digit mobile"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full p-2.5 rounded-xl border font-bold text-sm"
                />
              </div>

              {authTab !== 'forgot' && (
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">ପାସୱାର୍ଡ:</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full p-2.5 rounded-xl border font-bold text-sm"
                  />
                </div>
              )}

              {authTab === 'register' && (
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">ଜିଲ୍ଲା (District):</label>
                  <input
                    type="text"
                    value={district}
                    onChange={(e) => setDistrict(e.target.value)}
                    className="w-full p-2.5 rounded-xl border font-bold text-sm"
                  />
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-green-950 font-black text-sm shadow-md transition-all active:scale-95"
              >
                {loading ? 'ପ୍ରକ୍ରିୟା ଚାଲିଛି...' : (authTab === 'login' ? 'ଲଗଇନ୍ କରନ୍ତୁ' : (authTab === 'register' ? 'ପଞ୍ଜୀକରଣ କରନ୍ତୁ' : 'OTP ପଠାନ୍ତୁ'))}
              </button>
            </form>

            {/* Quick Demo Login Help */}
            <div className="mt-4 pt-3 border-t text-center">
              <button
                onClick={() => {
                  setPhone('9876543210');
                  setPassword('password123');
                  handleSubmit();
                }}
                className="text-xs text-green-800 hover:text-green-900 font-bold underline"
              >
                ⚡ ଡେମୋ ଚାଷୀ ଆକାଉଣ୍ଟରେ ତୁରନ୍ତ ଲଗଇନ୍ କରନ୍ତୁ (1-Click Demo Login)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 15. RENDER ROOT
    // =========================================================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
