    const dbKey = localStorage.getItem('VITE_SUPABASE_ANON_KEY') || (window.__ENV__ && window.__ENV__.VITE_SUPABASE_ANON_KEY) || '';

    // 3. VOICE PROCESSING LOGIC
    // =========================================================================
    const blobToBase64 = (blob) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const dataUrl = reader.result;
          const base64 = typeof dataUrl === 'string' ? dataUrl.split(',')[1] : '';
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    };

    async function processOdiaAudio(audioBlob) {
      const apiKey = localStorage.getItem('VITE_GEMINI_API_KEY') || 
                     (window.__ENV__ && window.__ENV__.VITE_GEMINI_API_KEY) || 
                     '';

      if (!apiKey) {
        await new Promise(res => setTimeout(res, 1200));
        return {
          age: 55,
          occupation: "Farmer",
          income: 40000,
          has_ration_card: true,
          transcript_odia: "ମୋ ବୟସ ୫୫ ବର୍ଷ, ମୁଁ ଜଣେ ଚାଷୀ, ବାର୍ଷିକ ଆୟ ୪୦,୦୦୦ ଟଙ୍କା ଏବଂ ମୋର ରାସନ କାର୍ଡ ଅଛି।"
        };
      }

      const base64Audio = await blobToBase64(audioBlob);

      const promptText = `You are an expert Odia speech understanding AI assistant for rural farmers in Odisha.
Listen carefully to the provided spoken Odia audio and extract the farmer's details into a strict JSON object:
{
  "age": number (farmer's age in years, or null if unmentioned),
  "occupation": string ("Farmer" | "Agricultural Labourer" | "Small Artisan" | "Self Employed" | "Other"),
  "income": number (annual household income in INR as integer, or null if unmentioned),
  "has_ration_card": boolean (true if the farmer mentions having a ration/food card or BSKY card, false otherwise),
  "transcript_odia": string (verbatim transcription of what the farmer said in Odia)
}
Return JSON ONLY, without markdown fences or additional explanation.`;

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: promptText },
                  {
                    inlineData: {
                      mimeType: audioBlob.type || 'audio/webm',
                      data: base64Audio
                    }
                  }
                ]
              }
            ],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        }
      );

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Voice service error: ${response.status}`);
      }

      const result = await response.json();
      const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("No transcription received");

      const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanJson);

      return {
        age: parsed.age ? Number(parsed.age) : 55,
        occupation: parsed.occupation || 'Farmer',
        income: parsed.income !== undefined && parsed.income !== null ? Number(parsed.income) : 40000,
        has_ration_card: Boolean(parsed.has_ration_card),
        transcript_odia: parsed.transcript_odia || "ଓଡ଼ିଆ ଭଏସ୍ ସଫଳତାର ସହ ବୁଝାଗଲା।"
      };
    }

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerIntervalRef = useRef(null);

      useEffect(() => {
        return () => {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        };
      }, []);

      const startRecording = async () => {
        setErrorMessage(null);
        setTranscriptInfo(null);
        audioChunksRef.current = [];

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setErrorMessage({
            or: "ଆପଣଙ୍କ ବ୍ରାଉଜରରେ ମାଇକ୍ ସମର୍ଥନ ନାହିଁ। ଦୟାକରି ତଳେ ଥିବା ନମୁନା ବଟନ୍ ଦବାନ୍ତୁ।",
            en: "Microphone recording is not supported. Use the demo button below."
          });
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;

          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              audioChunksRef.current.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((track) => track.stop());
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            await handleAudioProcessing(audioBlob);
          };

          mediaRecorder.start(250);
          setIsRecording(true);
          setRecordDuration(0);

          timerIntervalRef.current = setInterval(() => {
            setRecordDuration((prev) => prev + 1);
          }, 1000);
        } catch (err) {
          console.error("Microphone access error:", err);
          setErrorMessage({
            or: "ମାଇକ୍ରୋଫୋନ୍ ଅନୁମତି ମିଳିଲା ନାହିଁ। ବ୍ରାଉଜରରେ ମାଇକ୍ On କରନ୍ତୁ କିମ୍ବା ଡେମୋ ବଟନ୍ ବ୍ୟବହାର କରନ୍ତୁ।",

          setIsRecording(false);

      const handleAudioProcessing = async (audioBlob) => {
        setIsProcessing(true);

    function SoilAnalyzer() {
      const [selectedImage, setSelectedImage] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [savedToDb, setSavedToDb] = useState(false);

      const fileInputRef = useRef(null);

      const handleImageChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setSelectedImage(file);
        setImagePreview(URL.createObjectURL(file));
        setAnalysisResult(null);
        setErrorMessage(null);
        setSavedToDb(false);

        analyzeSoilImage(file);
      };

      const analyzeSoilImage = async (imageFile) => {
        setIsAnalyzing(true);
        setErrorMessage(null);
        setAnalysisResult(null);
        setSavedToDb(false);

        try {
          const base64Data = await blobToBase64(imageFile);
          const systemPrompt = "Act as an expert agricultural assistant. Analyze this image of farm soil. Reply strictly in a valid JSON format with exactly two keys: 'soil_quality' (describe how hydrated/dry it looks and its visual condition in simple Odia script) and 'solution' (provide simple tips in Odia to improve fertility, like weed removal or planting). Do not include markdown code blocks, just the raw JSON.";

          const apiKey = localStorage.getItem('VITE_GEMINI_API_KEY') || 
                         (window.__ENV__ && window.__ENV__.VITE_GEMINI_API_KEY) || 
                         '';

          let parsedData = null;

          if (apiKey) {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        { text: systemPrompt },
                        {
                          inlineData: {
                            mimeType: imageFile.type || 'image/jpeg',
                            data: base64Data
                          }
                        }
                      ]
                    }
                  ],
                  generationConfig: {
                    responseMimeType: "application/json"
                  }
                })
              }
            );

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`AI service error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const rawContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawContent) throw new Error("No analysis returned");

            const cleanJson = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();

                    solution: parsedData.solution

                setSavedToDb(true);

            }

            or: "ମାଟିର ଫଟୋ ବିଶ୍ଳେଷଣରେ ସମସ୍ୟା ହେଲା। ଦୟାକରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।",

    // =========================================================================
    // 7. COMPONENT: SchemeResults (Dual Odia & English Speech Synthesis)
    // =========================================================================
    function SchemeResults({ userData }) {
      const [schemes, setSchemes] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [speakingKey, setSpeakingKey] = useState(null);

      // Fetch matching schemes
      useEffect(() => {
        async function fetchSchemes() {
          if (!userData) return;
          setIsLoading(true);

          const age = Number(userData.age) || 55;
          const income = Number(userData.income) || 40000;
          const hasRationCard = Boolean(userData.has_ration_card);

          try {
            if (dbClient) {
              let query = dbClient.from('schemes').select('*');
              if (age > 0) query = query.lte('min_age', age);
              if (income > 0) query = query.gte('max_income', income);
              if (!hasRationCard) query = query.eq('requires_ration_card', false);

              const { data, error } = await query;
              if (!error && data && data.length > 0) {
                setSchemes(data);
                setIsLoading(false);
                return;
              }
            }
          } catch (e) {
            console.warn("Notice: Loading matched government schemes.");
          }

          // Matched local schemes
          const matched = SCHEMES_DATA.filter(s => {
            if (s.min_age && age < s.min_age) return false;
            if (s.max_income && income > 0 && income > s.max_income) return false;
            if (s.requires_ration_card && !hasRationCard) return false;
            return true;
          });
          setSchemes(matched);
          setIsLoading(false);
        }

        fetchSchemes();
      }, [userData?.age, userData?.income, userData?.occupation, userData?.has_ration_card]);

      /**
       * Universal Speech Synthesis
       */
      const speakText = (key, text, lang = 'en') => {
        if (!('speechSynthesis' in window)) {
          alert("ଆପଣଙ୍କ ବ୍ରାଉଜରରେ ସ୍ପିଚ୍ ସିନ୍ଥେସିସ୍ ସମର୍ଥନ ନାହିଁ। (Speech synthesis is not supported on this browser)");
          return;
        }

        if (speakingKey === key) {
          window.speechSynthesis.cancel();
          setSpeakingKey(null);
          return;
        }

        window.speechSynthesis.cancel();
        setSpeakingKey(key);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;

        const voices = window.speechSynthesis.getVoices();
        let selectedVoice = null;

        if (lang === 'or') {
          selectedVoice = voices.find(v => v.lang.includes('or') || v.lang.includes('ori') || v.lang.includes('hi-IN') || v.lang.includes('en-IN'));
        } else {
          selectedVoice = voices.find(v => v.lang.includes('en-IN') || v.lang.includes('en-GB') || v.lang.includes('en-US') || v.lang.includes('en'));
        }

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.onend = () => setSpeakingKey(null);
        utterance.onerror = () => setSpeakingKey(null);

        window.speechSynthesis.speak(utterance);
      };

      const handlePlayOdiaSummary = () => {
        const count = schemes.length;
        const names = schemes.map((s, idx) => `${idx + 1}. ${s.name_or || s.name_en}`).join('। ');
        const speechText = `ଓଡ଼ିଆ ସହାୟକ ସୂଚନା। ଆପଣଙ୍କ ବୟସ ${userData?.age || 55} ଏବଂ ଆୟ ଅନୁଯାୟୀ ${count} ଟି ସରକାରୀ ଯୋଜନା ଚିହ୍ନଟ ହୋଇଛି। ଯେପରିକି: ${names}। ପ୍ରତ୍ୟେକ ଯୋଜନାର ବିବରଣୀ ତଳେ ଉପଲବ୍ଧ ଅଛି।`;
        speakText("summary-or", speechText, "or");
      };

      const handlePlayEnglishSummary = () => {
        const count = schemes.length;
        const names = schemes.map((s, idx) => `${idx + 1}. ${s.name_en || s.name_or}`).join(', ');
        const speechText = `Odia Sahayak Scheme Summary: Based on your age of ${userData?.age || 55} and household income, you are eligible for ${count} government schemes: ${names}. You can listen to each scheme details below and click to apply online.`;
        speakText("summary-en", speechText, "en");
      };

      return (
        <section className="w-full mt-6" aria-label="Eligible Government Schemes Results">
          {/* Results Header Bar with Dual Summary Buttons */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 bg-green-900 text-white p-5 rounded-2xl shadow-sm border-l-8 border-amber-500">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌾</span>
                <h2 className="text-xl sm:text-2xl font-black">
                  ଆପଣଙ୍କ ପାଇଁ ଯୋଗ୍ୟ ସରକାରୀ ଯୋଜନା
                </h2>
              </div>
              <p className="text-xs sm:text-sm text-green-200 mt-1">
                ଯୋଗ୍ୟତା ତଥ୍ୟ / Matched Schemes: Age {userData?.age || '55'} • {userData?.occupation || 'Farmer'} • Income ₹{Number(userData?.income || 40000).toLocaleString('en-IN')} • Ration Card: {userData?.has_ration_card ? 'Yes' : 'No'}
              </p>
            </div>

            {/* Play Summary Buttons (Odia & English) */}
            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={handlePlayOdiaSummary}
                className={`inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-bold text-xs shadow-md active:scale-95 transition-all ${
                  speakingKey === "summary-or"
                    ? 'bg-red-600 text-white ring-4 ring-red-300 animate-pulse'
                    : 'bg-amber-400 hover:bg-amber-500 text-green-950 border border-amber-300'
                }`}
              >
                <span>{speakingKey === "summary-or" ? '⏹️' : '🔊'}</span>
                <span>{speakingKey === "summary-or" ? 'ବନ୍ଦ କରନ୍ତୁ' : 'ସାରାଂଶ (Odia)'}</span>
              </button>

              <button
                type="button"
                onClick={handlePlayEnglishSummary}
                className={`inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-bold text-xs shadow-md active:scale-95 transition-all ${
                  speakingKey === "summary-en"
                    ? 'bg-red-600 text-white ring-4 ring-red-300 animate-pulse'
                    : 'bg-green-700 hover:bg-green-600 text-white border border-green-600'
                }`}
              >
                <span>{speakingKey === "summary-en" ? '⏹️' : '🔊'}</span>
                <span>{speakingKey === "summary-en" ? 'Stop Audio' : 'Summary (English)'}</span>
              </button>

              <span className="px-3 py-1.5 rounded-full text-xs font-bold bg-green-800 text-green-200 border border-green-700">
                {schemes?.length || 0} ଟି ଯୋଜନା
              </span>
            </div>
          </div>

          {/* Loading Skeleton */}
          {isLoading && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {[1, 2].map((i) => (
                <div key={i} className="bg-white rounded-3xl p-6 border-2 border-stone-200 animate-pulse">
                  <div className="h-6 bg-stone-200 rounded-full w-2/3 mb-4"></div>
                  <div className="h-4 bg-stone-200 rounded-full w-full mb-2"></div>
                  <div className="h-4 bg-stone-200 rounded-full w-4/5 mb-6"></div>
                  <div className="h-20 bg-stone-100 rounded-2xl mb-4"></div>
                  <div className="h-10 bg-stone-200 rounded-xl w-full"></div>
                </div>
              ))}
            </div>
          )}

          {/* Empty State */}
          {!isLoading && (!schemes || schemes.length === 0) && (
            <div className="bg-white rounded-3xl p-8 text-center border-2 border-stone-200 shadow-sm">
              <div className="w-16 h-16 mx-auto mb-3 text-amber-600 bg-amber-100 rounded-full flex items-center justify-center text-3xl">
                🌾
              </div>
              <h3 className="text-xl font-bold text-green-950">
                କୌଣସି ଯୋଜନା ମିଳିଲା ନାହିଁ (No Matching Schemes)
              </h3>
              <p className="text-sm text-stone-600 mt-2 max-w-md mx-auto">
                ଆପଣଙ୍କ ବୟସ କିମ୍ବା ଆୟ ଫର୍ମରେ ପରିବର୍ତ୍ତନ କରି ପୁନର୍ବାର ଯାଞ୍ଚ କରନ୍ତୁ।
              </p>
            </div>
          )}

          {/* Schemes Grid */}
          {!isLoading && schemes && schemes.length > 0 && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {schemes.map((scheme) => {
                const isPlayingOdia = speakingKey === `${scheme.id}-or`;
                const isPlayingEnglish = speakingKey === `${scheme.id}-en`;

                const odiaAudioText = scheme.audioText_or || `${scheme.name_or}। ${scheme.description_or}`;
                const englishAudioText = scheme.audioText_en || `${scheme.name_en}: ${scheme.description_en || ''}`;

                return (
                  <article
                    key={scheme.id || scheme.slug || scheme.name_en}
                    className="bg-white rounded-3xl p-6 sm:p-7 shadow-md border-2 border-green-800/15 hover:border-amber-500 hover:shadow-xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden group"
                  >
                    <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-green-700 via-amber-500 to-green-800"></div>

                    <div>
                      {/* Badge & Dual Audio Buttons */}
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold border ${scheme.badgeColor || 'bg-green-100 text-green-900 border-green-300'}`}>
                          {scheme.badge || 'ଓଡ଼ିଶା ସରକାର / Govt. of Odisha'}
                        </span>

                        {/* Dual Audio Playback Buttons: Odia and English */}
                        <div className="flex items-center gap-1.5">
                          {/* Odia Audio Button */}
                          <button
                            type="button"
                            onClick={() => speakText(`${scheme.id}-or`, odiaAudioText, "or")}
                            title="Listen in Odia"
                            className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold transition-all active:scale-95 shadow-sm ${
                              isPlayingOdia
                                ? 'bg-red-600 text-white animate-pulse'
                                : 'bg-amber-100 text-amber-900 hover:bg-amber-200 border border-amber-300'
                            }`}
                          >
                            <span>{isPlayingOdia ? '⏹️' : '🔊'}</span>
                            <span>{isPlayingOdia ? 'Stop' : 'ଶୁଣନ୍ତୁ (Odia)'}</span>
                          </button>

                          {/* English Audio Button (Works 100% reliably on all machines) */}
                          <button
                            type="button"
                            onClick={() => speakText(`${scheme.id}-en`, englishAudioText, "en")}
                            title="Listen in English"
                            className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold transition-all active:scale-95 shadow-sm ${
                              isPlayingEnglish
                                ? 'bg-red-600 text-white animate-pulse'
                                : 'bg-stone-100 text-stone-800 hover:bg-stone-200 border border-stone-300'
                            }`}
                          >
                            <span>{isPlayingEnglish ? '⏹️' : '🔊'}</span>
                            <span>{isPlayingEnglish ? 'Stop' : 'Listen (English)'}</span>
                          </button>
                        </div>
                      </div>

                      {/* Scheme Title in Odia & English (Bilingual, e.g. KALIA and PM-KISAN) */}
                      <h3 className="text-xl sm:text-2xl font-black text-green-950 group-hover:text-green-800 transition-colors">
                        {scheme.name_or || scheme.name}
                      </h3>
                      <p className="text-xs sm:text-sm font-semibold text-stone-500 mb-2">
                        {scheme.name_en} — <span className="font-normal text-stone-400">{scheme.department_en || scheme.department}</span>
                      </p>

                      {/* Description */}
                      <p className="text-sm text-stone-700 leading-relaxed bg-orange-50/70 p-3.5 rounded-2xl border border-orange-100 mb-4 font-medium">
                        {scheme.description_or || scheme.description_en}
                      </p>

                      {/* Benefits */}
                      <div className="mb-4">
                        <h4 className="text-xs sm:text-sm font-bold text-green-950 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                          <span className="text-green-700 font-extrabold">✓</span>
                          <span>ମୁଖ୍ୟ ଲାଭ / Key Benefits:</span>
                        </h4>
                        <ul className="space-y-2 text-xs sm:text-sm text-stone-700">
                          {(scheme.benefits_or || scheme.benefits_en || []).map((benefit, idx) => (
                            <li key={idx} className="flex items-start gap-2">
                              <span className="w-4 h-4 rounded-full bg-green-100 text-green-800 font-bold flex items-center justify-center flex-shrink-0 text-[10px] mt-0.5">
                                ✓
                              </span>
                              <span className="font-medium text-stone-800">{benefit}</span>
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Documents */}
                      {(scheme.documents_or || scheme.documents_en) && (
                        <div className="mb-4 pt-3 border-t border-stone-100">
                          <p className="text-xs font-bold text-stone-600 mb-1.5">
                            📄 ଆବଶ୍ୟକୀୟ କାଗଜପତ୍ର (Documents Required):
                          </p>
                          <div className="flex flex-wrap gap-1.5">
                            {(scheme.documents_or || scheme.documents_en).map((doc, docIdx) => (
                              <span 
                                key={docIdx}
                                className="text-[11px] bg-stone-100 text-stone-700 px-2 py-0.5 rounded-md border border-stone-200"
                              >
                                {doc}
                              </span>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Action Bar */}
                    <div className="pt-4 border-t border-stone-100 flex flex-col sm:flex-row items-center justify-between gap-3 mt-2">
                      <div className="text-xs text-stone-500 text-center sm:text-left">
                        <span className="block font-semibold text-stone-700">
                          ହେଲ୍ପଲାଇନ୍: {scheme.helpline || '1551'}
                        </span>
                        <span className="text-[10px] text-green-700 font-medium">
                          ନିକଟସ୍ଥ 'ମୋ ସେବା କେନ୍ଦ୍ର' ରେ ଉପଲବ୍ଧ
                        </span>
                      </div>

                      <a
                        href={scheme.official_link || 'https://odisha.gov.in'}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold bg-green-800 hover:bg-green-900 text-white shadow hover:shadow-md active:scale-95 transition-all duration-200 border border-green-950"
                      >
                        <span>ଅଧିକ ଜାଣନ୍ତୁ ଓ ଆବେଦନ</span>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                      </a>
                    </div>
                  </article>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    }

    // =========================================================================
    // 9. MAIN APP CONTAINER
    // =========================================================================
    function App() {
      const [formData, setFormData] = useState({
        age: 55,
        occupation: 'Farmer',
        income: 40000,
        has_ration_card: true
      });

      const [highlightVoiceUpdate, setHighlightVoiceUpdate] = useState(false);

      const handleVoiceParsed = (extractedData) => {
        console.log("📥 Voice data parsed:", extractedData);

        const updatedForm = {
          age: extractedData.age !== undefined && extractedData.age !== null ? Number(extractedData.age) : formData.age,
          occupation: extractedData.occupation || formData.occupation,
          income: extractedData.income !== undefined && extractedData.income !== null ? Number(extractedData.income) : formData.income,
          has_ration_card: extractedData.has_ration_card !== undefined ? Boolean(extractedData.has_ration_card) : formData.has_ration_card
        };

        setFormData(updatedForm);

        // Flash visual highlight
        setHighlightVoiceUpdate(true);
        setTimeout(() => setHighlightVoiceUpdate(false), 4000);
      };

      const handleManualSubmit = (e) => {
        if (e) e.preventDefault();
        setFormData({ ...formData });
      };

      return (
        <div className="min-h-screen bg-orange-50/70 text-stone-900 font-sans flex flex-col antialiased">
          <HeroBanner />

          <main className="flex-1 w-full max-w-4xl mx-auto px-4 py-6 sm:py-10 flex flex-col gap-6 sm:gap-8">
            {/* Audio Prompt Tip */}
            <div className="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-green-950 font-bold px-4 py-3 rounded-2xl shadow-sm flex items-center justify-between text-xs sm:text-sm">
              <div className="flex items-center gap-2">
                <span className="text-xl">🎙️</span>
                <span>ଓଡ଼ିଆରେ କହିବା ପାଇଁ ତଳ ବଟନ୍ ଦବାନ୍ତୁ (Press big mic button below to speak)</span>
              </div>
              <span className="hidden sm:inline-block bg-white/40 px-2 py-0.5 rounded-full text-xs font-black">
                ଭଏସ୍ ସମର୍ଥିତ
              </span>
            </div>

            <VoiceRecorder 
              onVoiceParsed={handleVoiceParsed} 
              isProcessingGlobal={false}
            />

            <SoilAnalyzer />

            <EligibilityForm
              formData={formData}
              setFormData={setFormData}
              onSubmit={handleManualSubmit}
              isLoading={false}
              highlightVoiceUpdate={highlightVoiceUpdate}
            />

            <SchemeResults 
              userData={formData}
            />
          </main>

          <DisclaimerFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
